<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모던 계산기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 20px;
    }

    .calculator-container {
      display: flex;
      gap: 20px;
      max-width: 720px;
      width: 100%;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    .calculator {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 24px;
      width: 340px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .display {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 16px 20px;
      text-align: right;
      margin-bottom: 20px;
      word-break: break-all;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
    }

    .previous-operand {
      color: #94a3b8;
      font-size: 15px;
      min-height: 20px;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current-operand {
      color: #ffffff;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }

    button:active {
      transform: scale(0.94);
    }

    /* 숫자 버튼 */
    .btn-num {
      background: #334155;
      color: #f8fafc;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .btn-num:hover {
      background: #475569;
    }

    /* 상단 특수 버튼 (AC, Backspace, %) */
    .btn-func {
      background: #475569;
      color: #38bdf8;
    }
    .btn-func:hover {
      background: #64748b;
    }

    /* 연산자 버튼 (+, -, ×, ÷) */
    .btn-op {
      background: #6366f1;
      color: #ffffff;
    }
    .btn-op:hover {
      background: #4f46e5;
    }
    .btn-op.active {
      background: #ffffff;
      color: #4f46e5;
    }

    /* 등호 버튼 (=) */
    .btn-equals {
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);
    }
    .btn-equals:hover {
      filter: brightness(1.1);
    }

    .history-panel {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 24px;
      width: 280px;
      height: 488px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
    }

    .history-title {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .clear-history-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      cursor: pointer;
      height: auto;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .clear-history-btn:hover {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .history-list::-webkit-scrollbar {
      width: 5px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .history-item {
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      text-align: right;
      cursor: pointer;
      transition: background 0.15s;
    }
    .history-item:hover {
      background: rgba(15, 23, 42, 0.85);
      outline: 1px solid rgba(99, 102, 241, 0.4);
    }

    .history-expr {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .history-res {
      font-size: 18px;
      font-weight: 600;
      color: #38bdf8;
    }

    .history-empty {
      text-align: center;
      color: #64748b;
      margin-top: 60px;
      font-size: 14px;
    }

    .shortcut-hint {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="calculator-container">
  <!-- 계산기 본체 -->
  <div class="calculator">
    <div class="header-bar">
      <span>CALCULATOR</span>
      <span>키보드 입력 지원</span>
    </div>

    <div class="display">
      <div id="prevOperand" class="previous-operand"></div>
      <div id="currOperand" class="current-operand">0</div>
    </div>

    <div class="buttons">
      <!-- 1행 -->
      <button class="btn-func" onclick="calculator.clear()">AC</button>
      <button class="btn-func" onclick="calculator.delete()">⌫</button>
      <button class="btn-func" onclick="calculator.percentage()">%</button>
      <button class="btn-op" onclick="calculator.chooseOperation('÷')">÷</button>

      <!-- 2행 -->
      <button class="btn-num" onclick="calculator.appendNumber('7')">7</button>
      <button class="btn-num" onclick="calculator.appendNumber('8')">8</button>
      <button class="btn-num" onclick="calculator.appendNumber('9')">9</button>
      <button class="btn-op" onclick="calculator.chooseOperation('×')">×</button>

      <!-- 3행 -->
      <button class="btn-num" onclick="calculator.appendNumber('4')">4</button>
      <button class="btn-num" onclick="calculator.appendNumber('5')">5</button>
      <button class="btn-num" onclick="calculator.appendNumber('6')">6</button>
      <button class="btn-op" onclick="calculator.chooseOperation('-')">-</button>

      <!-- 4행 -->
      <button class="btn-num" onclick="calculator.appendNumber('1')">1</button>
      <button class="btn-num" onclick="calculator.appendNumber('2')">2</button>
      <button class="btn-num" onclick="calculator.appendNumber('3')">3</button>
      <button class="btn-op" onclick="calculator.chooseOperation('+')">+</button>

      <!-- 5행 -->
      <button class="btn-num" onclick="calculator.toggleSign()">±</button>
      <button class="btn-num" onclick="calculator.appendNumber('0')">0</button>
      <button class="btn-num" onclick="calculator.appendNumber('.')">.</button>
      <button class="btn-equals" onclick="calculator.compute()">=</button>
    </div>

    <div class="shortcut-hint">
      Enter(=), Backspace(⌫), Esc(AC), 숫자 및 사칙연산 키 지원
    </div>
  </div>

  <!-- 계산 기록(히스토리) 패널 -->
  <div class="history-panel">
    <div class="history-header">
      <span class="history-title">계산 기록</span>
      <button class="clear-history-btn" onclick="calculator.clearHistory()">기록 삭제</button>
    </div>
    <div id="historyList" class="history-list">
      <div class="history-empty">기록이 없습니다.</div>
    </div>
  </div>
</div>

<script>
class Calculator {
  constructor(prevOperandEl, currOperandEl, historyListEl) {
    this.prevOperandEl = prevOperandEl;
    this.currOperandEl = currOperandEl;
    this.historyListEl = historyListEl;
    this.history = [];
    this.clear();
  }

  clear() {
    this.currentOperand = '0';
    this.previousOperand = '';
    this.operation = undefined;
    this.shouldResetScreen = false;
    this.updateDisplay();
  }

  delete() {
    if (this.shouldResetScreen) {
      this.currentOperand = '0';
      this.shouldResetScreen = false;
      this.updateDisplay();
      return;
    }
    if (this.currentOperand === '0' || this.currentOperand === '오류') return;
    if (this.currentOperand.length === 1 || (this.currentOperand.length === 2 && this.currentOperand.startsWith('-'))) {
      this.currentOperand = '0';
    } else {
      this.currentOperand = this.currentOperand.slice(0, -1);
    }
    this.updateDisplay();
  }

  appendNumber(number) {
    if (this.currentOperand === '오류' || this.shouldResetScreen) {
      this.currentOperand = '';
      this.shouldResetScreen = false;
    }
    if (number === '.' && this.currentOperand.includes('.')) return;
    if (this.currentOperand === '0' && number !== '.') {
      this.currentOperand = number;
    } else {
      if (this.currentOperand === '' && number === '.') {
        this.currentOperand = '0.';
      } else {
        this.currentOperand = this.currentOperand + number;
      }
    }
    this.updateDisplay();
  }

  chooseOperation(operation) {
    if (this.currentOperand === '오류') return;
    if (this.previousOperand !== '') {
      this.compute(false);
    }
    this.operation = operation;
    this.previousOperand = this.currentOperand;
    this.shouldResetScreen = true;
    this.updateDisplay();
  }

  toggleSign() {
    if (this.currentOperand === '0' || this.currentOperand === '오류') return;
    if (this.currentOperand.startsWith('-')) {
      this.currentOperand = this.currentOperand.slice(1);
    } else {
      this.currentOperand = '-' + this.currentOperand;
    }
    this.updateDisplay();
  }

  percentage() {
    if (this.currentOperand === '0' || this.currentOperand === '오류') return;
    const current = parseFloat(this.currentOperand);
    this.currentOperand = (current / 100).toString();
    this.updateDisplay();
  }

  compute(isFinal = true) {
    let computation;
    const prev = parseFloat(this.previousOperand);
    const current = parseFloat(this.currentOperand);

    if (isNaN(prev) || isNaN(current) || !this.operation) return;

    switch (this.operation) {
      case '+':
        computation = prev + current;
        break;
      case '-':
        computation = prev - current;
        break;
      case '×':
        computation = prev * current;
        break;
      case '÷':
        if (current === 0) {
          this.currentOperand = '오류';
          this.previousOperand = '';
          this.operation = undefined;
          this.shouldResetScreen = true;
          this.updateDisplay();
          return;
        }
        computation = prev / current;
        break;
      default:
        return;
    }

    // 소수점 부동소수점 오차 정밀도 보정 (최대 10자리)
    const resultFormatted = parseFloat(computation.toFixed(10)).toString();

    if (isFinal) {
      this.addHistory(`${this.previousOperand} ${this.operation} ${this.currentOperand}`, resultFormatted);
      this.previousOperand = '';
      this.operation = undefined;
    } else {
      this.previousOperand = resultFormatted;
    }

    this.currentOperand = resultFormatted;
    this.shouldResetScreen = true;
    this.updateDisplay();
  }

  addHistory(expression, result) {
    this.history.unshift({ expression, result });
    if (this.history.length > 20) this.history.pop();
    this.renderHistory();
  }

  clearHistory() {
    this.history = [];
    this.renderHistory();
  }

  renderHistory() {
    if (this.history.length === 0) {
      this.historyListEl.innerHTML = '<div class="history-empty">기록이 없습니다.</div>';
      return;
    }

    this.historyListEl.innerHTML = this.history.map((item, index) => `
      <div class="history-item" onclick="calculator.loadHistory(${index})">
        <div class="history-expr">${item.expression} =</div>
        <div class="history-res">${this.formatDisplayNumber(item.result)}</div>
      </div>
    `).join('');
  }

  loadHistory(index) {
    const item = this.history[index];
    if (item) {
      this.currentOperand = item.result;
      this.shouldResetScreen = true;
      this.updateDisplay();
    }
  }

  formatDisplayNumber(numberStr) {
    if (numberStr === '오류') return '오류';
    if (!numberStr) return '';
    const parts = numberStr.split('.');
    const integerPart = parseFloat(parts[0]);
    const decimalPart = parts[1];
    
    let integerDisplay;
    if (isNaN(integerPart)) {
      integerDisplay = '';
    } else {
      integerDisplay = integerPart.toLocaleString('en');
    }

    if (decimalPart != null) {
      return `${integerDisplay}.${decimalPart}`;
    } else {
      return integerDisplay;
    }
  }

  updateDisplay() {
    this.currOperandEl.innerText = this.formatDisplayNumber(this.currentOperand);
    if (this.operation != null) {
      this.prevOperandEl.innerText = `${this.formatDisplayNumber(this.previousOperand)} ${this.operation}`;
    } else {
      this.prevOperandEl.innerText = '';
    }
  }
}

const prevOperandEl = document.getElementById('prevOperand');
const currOperandEl = document.getElementById('currOperand');
const historyListEl = document.getElementById('historyList');

const calculator = new Calculator(prevOperandEl, currOperandEl, historyListEl);

// 키보드 이벤트 연동
window.addEventListener('keydown', (e) => {
  if (e.key >= '0' && e.key <= '9') {
    calculator.appendNumber(e.key);
  } else if (e.key === '.') {
    calculator.appendNumber('.');
  } else if (e.key === '+' || e.key === '-') {
    calculator.chooseOperation(e.key);
  } else if (e.key === '*') {
    calculator.chooseOperation('×');
  } else if (e.key === '/') {
    e.preventDefault();
    calculator.chooseOperation('÷');
  } else if (e.key === 'Enter' || e.key === '=') {
    e.preventDefault();
    calculator.compute();
  } else if (e.key === 'Backspace') {
    calculator.delete();
  } else if (e.key === 'Escape') {
    calculator.clear();
  } else if (e.key === '%') {
    calculator.percentage();
  }
});
</script>

</body>
</html>
